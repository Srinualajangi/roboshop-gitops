# roboshop-gitops/platform/argo-rollouts/manifests/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: rollouts-dashboard, namespace: argo-rollouts }
spec:
  parentRefs:
    - name: traefik-gateway        # <- same Gateway as your other routes (kubectl get gateway -A)
      namespace: traefik
  hostnames: ["rollouts.roboshop.test"]
  rules:
    - backendRefs:
        - name: argo-rollouts-dashboard   # confirm: kubectl -n argo-rollouts get svc
          port: 3100
