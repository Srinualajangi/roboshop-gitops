# file: roboshop-gitops/platform/external-secrets/cluster-secret-store.yaml
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      # no "auth:" -> default credential chain -> workstation instance role via IMDS (lab only; EKS uses IRSA/Pod Identity)
