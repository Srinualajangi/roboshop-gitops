apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel                       # Service will be "otel-collector" in namespace tracing
  namespace: tracing
spec:
  mode: deployment
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }
  config:
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter:              # first: protects the collector from OOM under bursts
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch: {}                    # last before export: fewer, bigger requests
    exporters:
      otlp/tempo:
        endpoint: tempo.tracing.svc.cluster.local:4317
        tls: { insecure: true }
      debug:
        verbosity: basic           # prints a line per batch: handy while debugging
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo, debug]
