# roboshop-gitops/platform/jenkins/manifests/externalsecret-admin.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-admin
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: jenkins-admin            # Secret the Helm chart reads
    template:
      data:
        jenkins-admin-user: admin
        jenkins-admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: /roboshop/ci/jenkins-admin
