# roboshop-gitops/platform/jenkins/manifests/externalsecret-credentials.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: jenkins-credentials, namespace: jenkins }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: aws-ssm }
  target: { name: jenkins-credentials }
  data:
    - secretKey: sonar-token
      remoteRef: { key: /roboshop/ci/sonar-token }
    - secretKey: gitops-token
      remoteRef: { key: /roboshop/ci/gitops-token }
