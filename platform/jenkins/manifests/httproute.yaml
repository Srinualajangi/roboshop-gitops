# roboshop-gitops/platform/jenkins/manifests/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jenkins
  namespace: jenkins
spec:
  parentRefs:
    - name: traefik-gateway        # <- your Gateway name from Day 40
      namespace: traefik            # <- its namespace
  hostnames: ["jenkins.roboshop.test"]
  rules:
    - backendRefs:
        - name: jenkins             # Service created by the chart (release name "jenkins")
          port: 8080
