# file: roboshop-gitops/platform/argocd/route/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: traefik-gateway      # your Gateway from Day 40
      namespace: traefik
  hostnames:
    - argocd.roboshop.test
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
