# Environment namespaces + their budgets and defaults. Applied at boot by steps/platform.sh (and Argo CD from Phase 5).
apiVersion: v1
kind: Namespace
metadata:
  name: roboshop-dev
  labels: {env: dev, team: roboshop, pod-security.kubernetes.io/enforce: baseline, pod-security.kubernetes.io/warn: restricted, pod-security.kubernetes.io/audit: restricted}
---
apiVersion: v1
kind: Namespace
metadata:
  name: roboshop-qa
  labels: {env: qa, team: roboshop, pod-security.kubernetes.io/enforce: baseline, pod-security.kubernetes.io/warn: restricted, pod-security.kubernetes.io/audit: restricted}
---
apiVersion: v1
kind: Namespace
metadata:
  name: roboshop-prod
  labels: {env: prod, team: roboshop, pod-security.kubernetes.io/enforce: baseline, pod-security.kubernetes.io/warn: restricted, pod-security.kubernetes.io/audit: restricted}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: env-budget, namespace: roboshop-dev}
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.memory: 6Gi
    pods: "30"
    persistentvolumeclaims: "10"
    requests.storage: 10Gi
    services.loadbalancers: "0"     # no cloud LBs from app namespaces: traffic goes through the shared Gateway
    services.nodeports: "0"
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: env-budget, namespace: roboshop-qa}
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.memory: 6Gi
    pods: "30"
    persistentvolumeclaims: "10"
    requests.storage: 10Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: env-budget, namespace: roboshop-prod}
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.memory: 12Gi
    pods: "50"
    persistentvolumeclaims: "10"
    requests.storage: 20Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata: {name: container-defaults, namespace: roboshop-dev}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}    # injected when a container sets no requests
      default: {memory: 256Mi}                    # injected limit when none is set (no CPU limit by policy)
      max: {cpu: "2", memory: 2Gi}
      min: {cpu: 10m, memory: 16Mi}
    - type: PersistentVolumeClaim
      max: {storage: 5Gi}
---
apiVersion: v1
kind: LimitRange
metadata: {name: container-defaults, namespace: roboshop-qa}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}    # injected when a container sets no requests
      default: {memory: 256Mi}                    # injected limit when none is set (no CPU limit by policy)
      max: {cpu: "2", memory: 2Gi}
      min: {cpu: 10m, memory: 16Mi}
    - type: PersistentVolumeClaim
      max: {storage: 5Gi}
---
apiVersion: v1
kind: LimitRange
metadata: {name: container-defaults, namespace: roboshop-prod}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}    # injected when a container sets no requests
      default: {memory: 256Mi}                    # injected limit when none is set (no CPU limit by policy)
      max: {cpu: "2", memory: 2Gi}
      min: {cpu: 10m, memory: 16Mi}
    - type: PersistentVolumeClaim
      max: {storage: 5Gi}
---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    team: platform
