apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: roboshop-alerts
  namespace: monitoring
spec:
  groups:
    - name: roboshop.availability
      rules:
        - alert: RoboshopTargetDown
          expr: up{namespace=~"roboshop-.*"} == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} metrics target is down"
            description: "Prometheus has failed to scrape {{ $labels.instance }} for 5 minutes."
            runbook_url: https://github.com/Srinualajangi/roboshop-infra/blob/main/docs/runbooks/target-down.md

        - alert: RoboshopDeploymentUnavailable
          expr: |
            kube_deployment_status_replicas_available{namespace=~"roboshop-.*"} == 0
              and on (namespace, deployment) kube_deployment_spec_replicas > 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has NO available replicas"
            description: "Every pod of {{ $labels.deployment }} is down. Users are affected."
            runbook_url: https://github.com/Srinualajangi/roboshop-infra/blob/main/docs/runbooks/deployment-unavailable.md

        - alert: RoboshopPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace=~"roboshop-.*"}[15m]) > 3
          for: 1m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value | humanize }} times in 15m"
            description: "Container {{ $labels.container }} is crash-looping. Check: kubectl logs --previous."
            runbook_url: https://github.com/Srinualajangi/roboshop-infra/blob/main/docs/runbooks/crashloop.md

    - name: roboshop.user-facing
      rules:
        - alert: RoboshopHighErrorRate
          expr: |
            label_replace(
              (sum by (service) (rate(traefik_service_requests_total{service=~"roboshop-.*", code=~"5.."}[5m]))
                / sum by (service) (rate(traefik_service_requests_total{service=~"roboshop-.*"}[5m]))),
              "env", "$1", "service", "roboshop-(dev|qa|prod)-.*")
            > 0.05
            and on (service) sum by (service) (rate(traefik_service_requests_total{service=~"roboshop-.*"}[5m])) > 0.1
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.env }}: {{ $value | humanizePercentage }} of requests fail with 5xx"
            description: "More than 5% of requests through Traefik for {{ $labels.service }} return 5xx (min 0.1 req/s)."
            runbook_url: https://github.com/Srinualajangi/roboshop-infra/blob/main/docs/runbooks/high-error-rate.md

        - alert: RoboshopHighLatencyP95
          expr: |
            label_replace(
              histogram_quantile(0.95, sum by (le, service) (rate(traefik_service_request_duration_seconds_bucket{service=~"roboshop-.*"}[5m]))),
              "env", "$1", "service", "roboshop-(dev|qa|prod)-.*")
            > 0.5
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.env }}: p95 latency {{ $value | humanizeDuration }}"
            description: "95th percentile latency through Traefik for {{ $labels.service }} is above 500ms for 10 minutes."
            runbook_url: https://github.com/Srinualajangi/roboshop-infra/blob/main/docs/runbooks/high-latency.md

    - name: roboshop.capacity
      rules:
        - alert: RoboshopPVCAlmostFull
          expr: |
            kubelet_volume_stats_available_bytes{namespace=~"roboshop-.*"}
              / kubelet_volume_stats_capacity_bytes{namespace=~"roboshop-.*"} < 0.15
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} free"
            description: "Volume will fill soon. Databases stop accepting writes when the disk is full."
            runbook_url: https://github.com/Srinualajangi/roboshop-infra/blob/main/docs/runbooks/pvc-full.md
