apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-ssm }
  target: { name: alertmanager-slack }
  data:
    - secretKey: url
      remoteRef: { key: /roboshop/monitoring/slack-webhook }
