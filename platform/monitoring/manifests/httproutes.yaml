# parentRefs must point at the Gateway you created on Day 40. Check: kubectl get gateway -A
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: grafana, namespace: monitoring }
spec:
  parentRefs: [{ name: traefik-gateway, namespace: traefik }]
  hostnames: ["grafana.roboshop.test"]
  rules: [{ backendRefs: [{ name: grafana, port: 80 }] }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: prometheus, namespace: monitoring }
spec:
  parentRefs: [{ name: traefik-gateway, namespace: traefik }]
  hostnames: ["prometheus.roboshop.test"]
  rules: [{ backendRefs: [{ name: kps-prometheus, port: 9090 }] }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: alertmanager, namespace: monitoring }
spec:
  parentRefs: [{ name: traefik-gateway, namespace: traefik }]
  hostnames: ["alertmanager.roboshop.test"]
  rules: [{ backendRefs: [{ name: kps-alertmanager, port: 9093 }] }]
