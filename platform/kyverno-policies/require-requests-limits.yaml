apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/description: "CPU+memory requests and a memory limit are required. No CPU limit is required on purpose (avoids CFS throttling)."
spec:
  background: true
  rules:
    - name: requests-and-memory-limit
      match:
        any:
          - resources: { kinds: [Pod], namespaces: ["roboshop-*"] }
      validate:
        failureAction: Audit
        message: "Set resources.requests.cpu, resources.requests.memory and resources.limits.memory on every container."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
