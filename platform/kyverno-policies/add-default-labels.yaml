apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-default-labels
  annotations:
    policies.kyverno.io/description: "Mutate: stamp every RoboShop pod with part-of and environment labels (for cost and dashboards)."
spec:
  rules:
    - name: add-labels
      match:
        any:
          - resources: { kinds: [Pod], namespaces: ["roboshop-*"] }
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              +(app.kubernetes.io/part-of): roboshop
              +(roboshop.io/environment): "{{request.namespace}}"
