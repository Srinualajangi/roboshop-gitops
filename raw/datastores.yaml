apiVersion: v1
kind: Service
metadata: {name: mysql, namespace: roboshop-dev, labels: {app: mysql}}
spec:
  selector: {app: mysql}
  ports: [{name: mysql, port: 3306, targetPort: 3306}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mysql, namespace: roboshop-dev, labels: {app: mysql, tier: data}}
spec:
  serviceName: mysql
  replicas: 1
  selector: {matchLabels: {app: mysql}}
  template:
    metadata: {labels: {app: mysql, tier: data}}
    spec:
      imagePullSecrets: [{name: ecr-pull}]
      containers:
        - name: mysql
          image: $REGISTRY/roboshop/mysql:$IMAGE_TAG
          env:
            - {name: MYSQL_ROOT_PASSWORD, value: "RoboShop@1"}   # TEMPORARY - becomes a Secret on Day 37
          ports: [{containerPort: 3306, name: mysql}]
          volumeMounts: [{name: data, mountPath: /var/lib/mysql}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 2Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: roboshop-dev, labels: {app: redis}}
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis, namespace: roboshop-dev, labels: {app: redis, tier: data}}
spec:
  serviceName: redis
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis, tier: data}}
    spec:
      containers:
        - name: redis
          image: public.ecr.aws/docker/library/redis:7-alpine
          args: ["--appendonly", "yes"]
          ports: [{containerPort: 6379, name: redis}]
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 512Mi}}}
---
apiVersion: v1
kind: Service
metadata: {name: rabbitmq, namespace: roboshop-dev, labels: {app: rabbitmq}}
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
    - {name: management, port: 15672, targetPort: 15672}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: rabbitmq, namespace: roboshop-dev, labels: {app: rabbitmq, tier: data}}
spec:
  serviceName: rabbitmq
  replicas: 1
  selector: {matchLabels: {app: rabbitmq}}
  template:
    metadata: {labels: {app: rabbitmq, tier: data}}
    spec:
      containers:
        - name: rabbitmq
          image: public.ecr.aws/docker/library/rabbitmq:3-management-alpine
          ports:
            - {containerPort: 5672, name: amqp}
            - {containerPort: 15672, name: management}
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 512Mi}}}
