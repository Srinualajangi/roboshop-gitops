apiVersion: v1
kind: ConfigMap
metadata: {name: feature-flags-v1, namespace: roboshop-dev}
immutable: true            # cannot be edited: create v2 and point the pod at it (safer, and cheaper for the apiserver)
data:
  flags.json: '{"newCheckout": false}'
---
apiVersion: v1
kind: Pod
metadata: {name: file-demo, namespace: roboshop-dev}
spec:
  containers:
    - name: c
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["sh", "-c", "ls -l /etc/flags /etc/db; cat /etc/flags/flags.json; sleep 3600"]
      volumeMounts:
        - {name: flags, mountPath: /etc/flags, readOnly: true}
        - {name: db, mountPath: /etc/db, readOnly: true}
  volumes:
    - name: flags
      configMap: {name: feature-flags-v1}
    - name: db
      secret: {secretName: mysql-root, defaultMode: 0400}
