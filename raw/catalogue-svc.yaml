apiVersion: v1
kind: Service
metadata:
  name: catalogue            # this becomes the DNS name other services use
  namespace: roboshop-dev
  labels:
    app: catalogue
spec:
  type: ClusterIP
  selector:
    app: catalogue           # send traffic to ready pods with this label
  ports:
    - name: http
      port: 8080             # the Service port clients call
      targetPort: http       # the container port *name* (or number) in the pod
