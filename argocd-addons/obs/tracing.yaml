apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: tracing, namespace: argocd, annotations: { argocd.argoproj.io/sync-wave: "25" } }
spec:
  project: default
  source: { repoURL: "https://github.com/Srinualajangi/roboshop-gitops.git", targetRevision: main, path: platform/tracing }
  destination: { server: "https://kubernetes.default.svc", namespace: tracing }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
    retry: { limit: 5, backoff: { duration: 20s, factor: 2, maxDuration: 3m } }
