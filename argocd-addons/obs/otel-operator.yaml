apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: otel-operator, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "15"}}
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-operator
      targetRevision: 0.124.1
      helm: {releaseName: otel-operator, valueFiles: ["$values/platform/otel-operator/values.yaml"]}
    - {repoURL: "https://github.com/Srinualajangi/roboshop-gitops.git", targetRevision: main, ref: values}
  destination: {server: "https://kubernetes.default.svc", namespace: opentelemetry-operator-system}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
