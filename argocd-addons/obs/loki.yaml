# fast-track kit: Day 79 (the guide generated this with a bash loop the extractor missed)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.3.0 # pinned by scripts/ft-pin-versions.sh
      helm:
        releaseName: loki
        valueFiles: [$values/platform/loki/values.yaml]
    - repoURL: https://github.com/Srinualajangi/roboshop-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged # alloy reads /var/log/pods from the node (hostPath)
