apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://aquasecurity.github.io/helm-charts/
    chart: trivy-operator
    targetRevision: 0.37.0 # <- pin what you found
    helm:
      valuesObject:
        targetNamespaces: "roboshop-dev,roboshop-qa,roboshop-prod" # lab: only our apps (saves CPU)
        operator:
          scanJobsConcurrentLimit: 2
        trivy:
          ignoreUnfixed: true # show only CVEs you can actually fix by upgrading
          severity: "CRITICAL,HIGH"
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
