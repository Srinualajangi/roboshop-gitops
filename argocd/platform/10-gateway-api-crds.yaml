apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.3 # example — the GATEWAY_API_VERSION you pinned on Day 40
    path: config/crd/standard # the "standard channel" CRDs (Gateway, HTTPRoute, ...)
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # big CRDs exceed the 256 KB last-applied annotation otherwise
