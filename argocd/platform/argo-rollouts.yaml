apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5" # CRDs must exist before any app uses kind: Rollout
spec:
  project: default
  destination: {server: 'https://kubernetes.default.svc', namespace: argo-rollouts}
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-rollouts
      targetRevision: 2.43.6 # <- ROLLOUTS_CHART_VERSION
      helm:
        releaseName: argo-rollouts
        valueFiles: [$values/platform/argo-rollouts/values.yaml]
    - repoURL: https://github.com/Srinualajangi/roboshop-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Srinualajangi/roboshop-gitops.git
      targetRevision: main
      path: platform/argo-rollouts/manifests
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
