{{- if and (eq .Values.workload "StatefulSet") .Values.containerPort }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "svc.name" . }}-headless
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "svc.selector" . | nindent 4 }}
  ports:
    - name: {{ .Values.portName }}
      port: {{ .Values.containerPort }}
      targetPort: {{ .Values.portName }}
{{- end }}
