{{- /* Day 86-88: Argo Rollouts canary (replica-based) or blue/green. Same pod template as the Deployment. */ -}}
{{- if .Values.rollout.enabled }}
{{- $r := .Values.rollout }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "svc.name" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "svc.selector" . | nindent 6 }}
  template:
    {{- include "svc.podTemplate" . | nindent 4 }}
  strategy:
    {{- if eq $r.strategy "blueGreen" }}
    blueGreen:
      activeService: {{ include "svc.name" . }}
      previewService: {{ include "svc.name" . }}-preview
      autoPromotionEnabled: {{ $r.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ $r.blueGreen.scaleDownDelaySeconds }}
      {{- with $r.blueGreen.prePromotionAnalysis }}
      prePromotionAnalysis:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- else }}
    canary:
      maxSurge: "25%"
      maxUnavailable: 0
      {{- with $r.canary.analysis }}
      analysis:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      steps:
        {{- toYaml $r.canary.steps | nindent 8 }}
    {{- end }}
{{- end }}
