# qa: manual sync (a human or the promote workflow syncs). Generated by kit/tools/gen_envs.py.
tier: web
image:
  repository: roboshop/web
  tag: ec6c30f
  digest: 'sha256:5b642b75ee0e3a97b4b6e4983011e92b20f0d4262bcfdd72432228e515cc1b1c'
env:
  CATALOGUE_HOST: catalogue
  USER_HOST: user
  CART_HOST: cart
  SHIPPING_HOST: shipping
  PAYMENT_HOST: payment
  RATINGS_HOST: ratings
readinessProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 5
livenessProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
route:
  enabled: true
  hostname: qa.roboshop.test
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault
extraVolumes:
  - name: nginx-conf
    emptyDir: {}
extraVolumeMounts:
  - name: nginx-conf
    mountPath: /etc/nginx/conf.d
rollout:
  enabled: true
  strategy: blueGreen
  smokeTest:
    enabled: true
  blueGreen:
    autoPromotionEnabled: false
    scaleDownDelaySeconds: 60
    prePromotionAnalysis:
      templates:
        - templateName: web-smoke
      args:
        - name: base-url
          value: http://web-preview.roboshop-qa.svc.cluster.local:8080
zap:
  enabled: false
  target: http://web.roboshop-qa.svc:8080
