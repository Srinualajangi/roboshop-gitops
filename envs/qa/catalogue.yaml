# qa: manual sync (a human or the promote workflow syncs). Generated by kit/tools/gen_envs.py.
image:
  repository: roboshop/catalogue
  tag: not-built-yet
  digest: ''
env:
  MONGO_URL: mongodb://mongodb:27017/catalogue
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 24
readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 2
livenessProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
  failureThreshold: 3
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  cpuUtilization: 50
pdb:
  enabled: true
  minAvailable: 1
podAnnotations:
  instrumentation.opentelemetry.io/inject-nodejs: tracing/roboshop
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
