# qa: manual sync (a human or the promote workflow syncs). Generated by kit/tools/gen_envs.py.
image:
  repository: roboshop/ratings
  tag: not-built-yet
  digest: ''
containerPort: 8080
service:
  port: 8080
env:
  PDO_URL: mysql:host=mysql;dbname=ratings;charset=utf8mb4
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
readinessProbe:
