# qa: manual sync (a human or the promote workflow syncs). Generated by kit/tools/gen_envs.py.
image:
  repository: roboshop/shipping
  tag: not-built-yet
  digest: ''
env:
  CART_ENDPOINT: cart:8080
  DB_HOST: mysql
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 768Mi
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 36
readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 2
livenessProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
  failureThreshold: 3
podAnnotations:
  instrumentation.opentelemetry.io/inject-java: tracing/roboshop
deploymentAnnotations:
  reloader.stakater.com/auto: 'true'
