# dev: auto-sync + self-heal. Generated by kit/tools/gen_envs.py (fast-track kit).
image:
  repository: roboshop/cart
  tag: not-built-yet
  digest: ''
env:
  REDIS_HOST: redis
  CATALOGUE_HOST: catalogue
  CATALOGUE_PORT: '8080'
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 24
readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 2
livenessProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
  failureThreshold: 3
metrics:
  enabled: true
podAnnotations:
  instrumentation.opentelemetry.io/inject-nodejs: tracing/roboshop
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
