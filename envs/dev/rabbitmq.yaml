# dev: auto-sync + self-heal. Generated by kit/tools/gen_envs.py (fast-track kit).
tier: data
workload: StatefulSet
image:
  registry: public.ecr.aws
  repository: docker/library/rabbitmq
  tag: 3-management-alpine
  digest: ''
imagePullSecrets: []
portName: amqp
containerPort: 5672
extraPorts:
  - name: management
    containerPort: 15672
service:
  port: 5672
  extraPorts:
    - name: management
      port: 15672
      targetPort: 15672
tmpDir: true
externalSecret:
  enabled: true
  targetName: rabbitmq-credentials
  envFrom: true
  data:
    - secretKey: RABBITMQ_DEFAULT_USER
      remoteKey: /roboshop/dev/rabbitmq/username
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteKey: /roboshop/dev/rabbitmq/password
persistence:
  enabled: true
  size: 512Mi
  mountPath: /var/lib/rabbitmq
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 384Mi
readinessProbe:
  tcpSocket:
    port: amqp
  periodSeconds: 10
startupProbe:
  tcpSocket:
    port: amqp
  periodSeconds: 5
  failureThreshold: 36
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
