# dev: auto-sync + self-heal. Generated by kit/tools/gen_envs.py (fast-track kit).
tier: web
image:
  repository: roboshop/web
  tag: not-built-yet
  digest: ''
env:
  CATALOGUE_HOST: catalogue
  USER_HOST: user
  CART_HOST: cart
  SHIPPING_HOST: shipping
  PAYMENT_HOST: payment
  RATINGS_HOST: ratings
readinessProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 5
livenessProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
route:
  enabled: true
  hostname: dev.roboshop.test
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault
extraVolumes:
  - name: nginx-conf
    emptyDir: {}
extraVolumeMounts:
  - name: nginx-conf
    mountPath: /etc/nginx/conf.d
