# dev: auto-sync + self-heal. Generated by kit/tools/gen_envs.py (fast-track kit).
image:
  repository: roboshop/payment
  tag: not-built-yet
  digest: ''
env:
  CART_HOST: cart
  USER_HOST: user
  AMQP_HOST: rabbitmq
externalSecret:
  enabled: true
  targetName: payment-amqp
  envFrom: true
  data:
    - secretKey: AMQP_USER
      remoteKey: /roboshop/dev/rabbitmq/username
    - secretKey: AMQP_PASS
      remoteKey: /roboshop/dev/rabbitmq/password
resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    memory: 192Mi
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 24
readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 2
livenessProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
  failureThreshold: 3
metrics:
  enabled: true
podAnnotations:
  instrumentation.opentelemetry.io/inject-python: tracing/roboshop
