apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: roboshop-eks
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/Srinualajangi/roboshop-gitops.git
        revision: main
        files:
          - path: "envs-eks/prod/*.yaml"
  template:
    metadata:
      name: '{{ trimSuffix ".yaml" .path.filename }}-eks-prod'
    spec:
      project: default
      source:
        repoURL: https://github.com/Srinualajangi/roboshop-gitops.git
        targetRevision: main
        path: charts/roboshop-service
        helm:
          releaseName: '{{ trimSuffix ".yaml" .path.filename }}'
          valueFiles:
            - '../../envs/prod/{{ .path.filename }}'
            - '../../envs-eks/common.yaml'
            - '../../envs-eks/prod/{{ .path.filename }}'
      destination:
        server: https://kubernetes.default.svc     # "this cluster" = EKS (pull model)
        namespace: roboshop-prod
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
